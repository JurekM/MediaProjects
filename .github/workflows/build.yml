name: Build

on:
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Visual Studio 2026 and ATL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -products * -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio 2026 with the x86/x64 C++ tools was not found.'
          }
          $versionFile = Join-Path $installPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          $toolsVersion = (Get-Content $versionFile -Raw).Trim()
          $atlHeader = Join-Path $installPath "VC\Tools\MSVC\$toolsVersion\atlmfc\include\atlbase.h"
          if (-not (Test-Path -LiteralPath $atlHeader)) {
            throw "ATL is missing for MSVC $toolsVersion. Expected: $atlHeader"
          }
          $msbuild = Join-Path $installPath 'MSBuild\Current\Bin\MSBuild.exe'
          Write-Host "Visual Studio: $installPath"
          Write-Host "MSVC: $toolsVersion; platform toolset: v145"
          Write-Host "ATL: $atlHeader"
          "MEDIA_MSBUILD=$msbuild" >> $env:GITHUB_ENV

      - name: Build solution
        shell: pwsh
        run: |
          & $env:MEDIA_MSBUILD MediaProjects.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /verbosity:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect artifacts
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP "artifacts-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $nativePlatform = if ('${{ matrix.platform }}' -eq 'x86') { 'Win32' } else { 'x64' }
          $outputRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) '__binaries\MediaProjects'
          $projectDirs = @(
            "pic2video-$nativePlatform-${{ matrix.configuration }}",
            "pic2gallery-${{ matrix.configuration }}"
          )
          foreach ($projectDir in $projectDirs) {
            $source = Join-Path $outputRoot $projectDir
            $executable = if ($projectDir.StartsWith('pic2video-')) { 'pic2video.exe' } else { 'pic2gallery.exe' }
            if (-not (Test-Path -LiteralPath (Join-Path $source $executable))) {
              throw "Expected build output missing: $source\$executable"
            }
            Copy-Item -LiteralPath $source -Destination $artifactRoot -Recurse -Force
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.configuration }}
          path: ${{ runner.temp }}/artifacts-${{ matrix.platform }}
          if-no-files-found: error
